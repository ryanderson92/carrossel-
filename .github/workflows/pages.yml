name: Publicar no GitHub Pages

# Publica a versão oficial (branch main) na raiz do site
# e a versão de teste (branch teste) em /teste/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar a versão oficial (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: oficial

      - name: Baixar a versão de teste (teste)
        id: teste
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: teste
          path: teste

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Montar o site
        run: |
          PASTA_TESTE=""
          if [ "${{ steps.teste.outcome }}" = "success" ]; then PASTA_TESTE=teste; fi
          bash oficial/.github/scripts/montar-site.sh oficial "$PASTA_TESTE" _site

      - name: Enviar os arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
