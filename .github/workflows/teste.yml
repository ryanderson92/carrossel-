name: Atualizar a versão de teste

# O GitHub Pages só aceita publicar a partir da main.
# Por isso, um push na branch teste pede para a main republicar o site,
# que já inclui a versão de teste em /teste/.
on:
  push:
    branches: [teste]

permissions:
  actions: write

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - name: Republicar o site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "${{ github.repository }}"
